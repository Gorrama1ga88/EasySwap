    :root {

      padding: 14px 16px;

    }
    .inputWrap:focus-within { border-color: var(--accent); outline: none; }

      border: none;

      font-family: var(--fontMono);

    .inputWrap input::placeholder { color: var(--textMuted); }
    .inputWrap input:focus { outline: none; }
    .label {
      font-size: 0.75rem;
      color: var(--textMuted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .tokenBtn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;

      border: 1px solid var(--border);
      border-radius: var(--radiusSm);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      min-width: 120px;
      transition: background 0.2s, border-color 0.2s;
    }
    .tokenBtn:hover {
      background: var(--border);
      border-color: var(--accent);
    }
    .tokenBtn .sym { color: var(--accent); font-family: var(--fontMono); }
