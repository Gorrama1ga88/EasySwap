<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasySwap — Kite Swap Aggregator</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #161a20;
      --surface2: #1e232b;
      --border: #2a3038;
      --text: #e6eaef;
      --textMuted: #8b95a4;
      --accent: #22c4a2;
      --accentDim: #1a9b80;
      --danger: #e85d5d;
      --radius: 14px;
      --radiusSm: 8px;
      --font: 'DM Sans', system-ui, sans-serif;
      --fontMono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 196, 162, 0.08), transparent),
                        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 196, 162, 0.04), transparent);
    }
    .app {
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    h1 span { color: var(--accent); }
    .sub {
      font-size: 0.9rem;
      color: var(--textMuted);
      margin-top: 6px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .inputWrap {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radiusSm);
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .inputWrap:focus-within { border-color: var(--accent); outline: none; }
    .inputWrap input {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.1rem;
      font-family: var(--fontMono);
    }
    .inputWrap input::placeholder { color: var(--textMuted); }
    .inputWrap input:focus { outline: none; }
    .label {
      font-size: 0.75rem;
      color: var(--textMuted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .tokenBtn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radiusSm);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      min-width: 120px;
      transition: background 0.2s, border-color 0.2s;
    }
    .tokenBtn:hover {
      background: var(--border);
      border-color: var(--accent);
    }
    .tokenBtn .sym { color: var(--accent); font-family: var(--fontMono); }
    .swapArrow {
      display: flex;
      justify-content: center;
      margin: -4px 0;
    }
    .swapArrow button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--textMuted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      transition: all 0.2s;
    }
    .swapArrow button:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: rotate(180deg);
    }
    .quoteBox {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: var(--radiusSm);
      font-size: 0.85rem;
      color: var(--textMuted);
    }
    .quoteBox strong { color: var(--text); }
    .quoteBox .out { color: var(--accent); font-family: var(--fontMono); }
    .btn {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: var(--radiusSm);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btnPrimary {
      background: var(--accent);
      color: var(--bg);
      margin-top: 8px;
    }
    .btnPrimary:hover:not(:disabled) { background: var(--accentDim); }
    .btnPrimary:disabled {
      background: var(--surface2);
      color: var(--textMuted);
      cursor: not-allowed;
    }
    .btnConnect {
      background: linear-gradient(135deg, var(--accent) 0%, #1ea88a 100%);
      color: var(--bg);
      padding: 14px 28px;
      border-radius: var(--radius);
    }
    .btnConnect:hover { filter: brightness(1.08); }
    .status {
      font-size: 0.8rem;
      color: var(--textMuted);
      margin-top: 12px;
      text-align: center;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--accent); }
    .network {
      font-size: 0.8rem;
      color: var(--textMuted);
      margin-bottom: 16px;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--textMuted);
      text-align: center;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Easy<span>Swap</span></h1>
      <p class="sub">Kite swap aggregator — one route, best execution</p>
    </header>

    <div id="connectWrap" class="card" style="text-align: center; padding: 32px;">
      <p class="network" id="networkName">Connect wallet to see network</p>
      <button type="button" class="btn btnConnect" id="connectBtn">Connect wallet</button>
    </div>

    <div id="swapWrap" style="display: none;">
      <div class="network" id="networkName2"></div>
      <div class="card">
        <div class="row">
          <div style="flex: 1;">
            <div class="label">You pay</div>
            <div class="inputWrap">
              <input type="text" id="amountIn" placeholder="0.0" inputmode="decimal" autocomplete="off" />
            </div>
          </div>
          <div>
            <div class="label">&nbsp;</div>
            <button type="button" class="tokenBtn" id="tokenInBtn">
              <span class="sym" id="tokenInSym">ETH</span>
            </button>
          </div>
        </div>
        <div class="swapArrow">
          <button type="button" id="flipBtn" aria-label="Flip">⇅</button>
        </div>
        <div class="row">
          <div style="flex: 1;">
            <div class="label">You receive</div>
            <div class="inputWrap">
              <input type="text" id="amountOut" placeholder="0.0" readonly />
            </div>
          </div>
          <div>
            <div class="label">&nbsp;</div>
            <button type="button" class="tokenBtn" id="tokenOutBtn">
              <span class="sym" id="tokenOutSym">USDC</span>
            </button>
          </div>
        </div>
        <div id="quoteBox" class="quoteBox" style="display: none;"></div>
        <button type="button" class="btn btnPrimary" id="swapBtn" disabled>Enter amount</button>
      </div>
      <p class="status" id="status"></p>
    </div>

    <p class="footer">
      Powered by EasyTrade (Kite). Use at your own risk.
    </p>
  </div>

  <script>
    (function () {
      const AGGREGATOR_ADDRESS = '0x0000000000000000000000000000000000000000';
      const CHAIN_IDS = { 1: 'Ethereum', 5: 'Goerli', 137: 'Polygon', 42161: 'Arbitrum', 8453: 'Base' };
      const EASYTRADE_ABI = [
        'function executeSwapExactIn(address tokenIn, address tokenOut, uint256 amountIn, uint256 amountOutMin, uint256 deadline) returns (uint256 amountOut, uint256 feeWei)',
        'function quoteExactIn(address tokenIn, address tokenOut, uint256 amountIn) view returns (uint256 amountOutEst)',
        'function router() view returns (address)',
        'function kitePaused() view returns (bool)',
        'function weth() view returns (address)'
      ];
      const ERC20_ABI = ['function decimals() view returns (uint8)', 'function symbol() view returns (string)', 'function balanceOf(address) view returns (uint256)', 'function approve(address,uint256) returns (bool)', 'function allowance(address,address) view returns (uint256)'];
      const FEE_BPS = 10;
      const SLIPPAGE_BPS = 50;
      const BPS_DENOM = 10000;
      const DEADLINE_OFFSET = 300;

      let provider = null;
      let signer = null;
      let chainId = null;
      let aggregator = null;
      let tokenIn = { address: null, symbol: 'ETH', decimals: 18 };
      let tokenOut = { address: null, symbol: 'USDC', decimals: 6 };
      let quoteOut = null;
      let quoteTimer = null;

      const connectBtn = document.getElementById('connectBtn');
      const connectWrap = document.getElementById('connectWrap');
      const swapWrap = document.getElementById('swapWrap');
      const networkName = document.getElementById('networkName');
      const networkName2 = document.getElementById('networkName2');
      const amountInEl = document.getElementById('amountIn');
      const amountOutEl = document.getElementById('amountOut');
      const tokenInBtn = document.getElementById('tokenInBtn');
      const tokenOutBtn = document.getElementById('tokenOutBtn');
      const tokenInSym = document.getElementById('tokenInSym');
      const tokenOutSym = document.getElementById('tokenOutSym');
      const quoteBox = document.getElementById('quoteBox');
      const swapBtn = document.getElementById('swapBtn');
      const statusEl = document.getElementById('status');
      const flipBtn = document.getElementById('flipBtn');

      function setStatus(msg, type) {
        statusEl.textContent = msg || '';
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function showSwap() {
        connectWrap.style.display = 'none';
        swapWrap.style.display = 'block';
        const name = CHAIN_IDS[chainId] || 'Chain ' + chainId;
        networkName2.textContent = name;
      }

      function hideSwap() {
        swapWrap.style.display = 'none';
        connectWrap.style.display = 'block';
        networkName.textContent = 'Connect wallet to see network';
      }

      async function connect() {
        if (!window.ethereum) {
          setStatus('No wallet found. Install MetaMask or another Web3 wallet.', 'error');
          return;
        }
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          const accounts = await provider.send('eth_requestAccounts', []);
          if (!accounts.length) return;
          signer = await provider.getSigner();
          const net = await provider.getNetwork();
          chainId = Number(net.chainId);
          networkName.textContent = CHAIN_IDS[chainId] || 'Chain ' + chainId;
          aggregator = new ethers.Contract(AGGREGATOR_ADDRESS, EASYTRADE_ABI, signer);
          const wethAddr = await aggregator.weth();
          tokenIn.address = wethAddr;
          tokenOut.address = getDefaultQuoteToken(chainId);
          await loadTokenInfo(tokenIn);
          await loadTokenInfo(tokenOut);
          tokenInSym.textContent = tokenIn.symbol;
          tokenOutSym.textContent = tokenOut.symbol;
          showSwap();
          setStatus('');
        } catch (e) {
          setStatus(e.message || 'Connection failed', 'error');
        }
